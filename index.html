<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keos Room — Cyber Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #070a13;
      --bg-panel: rgba(12, 18, 34, 0.94);
      --bg-card: #0f172a;
      --border-dim: rgba(56, 189, 248, 0.15);
      --border-bright: #00f0ff;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #00f0ff;
      --accent-sky: #38bdf8;
      --accent-emerald: #00ff9d;
      --accent-fuchsia: #ec4899;
      --accent-purple: #a855f7;
      --accent-crimson: #ff3366;
      --accent-amber: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: var(--bg-void);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* TOP COMMAND BAR */
    .command-bar {
      height: 52px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 30;
      backdrop-filter: blur(12px);
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title .highlight {
      color: var(--accent-cyan);
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.45);
    }

    .led-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-emerald);
      box-shadow: 0 0 10px var(--accent-emerald);
      display: inline-block;
      border-radius: 50%;
      animation: pulse-led 2s infinite ease-in-out;
    }

    @keyframes pulse-led {
      0%, 100% { opacity: 0.7; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 16px var(--accent-emerald); }
    }

    .status-pills {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border: 1px solid var(--border-dim);
      background: var(--bg-card);
      color: var(--text-muted);
      border-radius: 4px;
    }

    .pill.cyan { border-color: rgba(0, 240, 255, 0.4); color: var(--accent-cyan); }
    .pill.emerald { border-color: rgba(0, 255, 157, 0.4); color: var(--accent-emerald); }

    .interaction-deck {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-action {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-dim);
      padding: 6px 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-action:hover {
      border-color: var(--border-bright);
      background: rgba(0, 240, 255, 0.12);
      color: #ffffff;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.25);
    }

    .btn-action.alert {
      border-color: rgba(255, 51, 102, 0.4);
      color: #fecdd3;
    }

    .btn-action.alert:hover {
      border-color: var(--accent-crimson);
      background: rgba(255, 51, 102, 0.2);
      box-shadow: 0 0 14px rgba(255, 51, 102, 0.35);
    }

    .btn-action.muted {
      color: #64748b;
      border-color: #334155;
    }

    /* MAIN VIEWPORT */
    .viewport-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
      background: var(--bg-void);
    }

    #office-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ACTIVITY LOG DRAWER */
    .telemetry-drawer {
      height: 125px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-dim);
      display: flex;
      flex-direction: column;
      z-index: 30;
      backdrop-filter: blur(12px);
    }

    .drawer-bar {
      padding: 6px 18px;
      background: rgba(7, 10, 19, 0.85);
      border-bottom: 1px solid var(--border-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .log-stream {
      flex: 1;
      overflow-y: auto;
      padding: 8px 18px;
      font-size: 11.5px;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .log-entry {
      display: flex;
      gap: 12px;
      align-items: center;
      animation: fadeIn 0.18s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .log-time { color: #64748b; }
    .log-tag { font-weight: 700; color: var(--accent-cyan); }
    .log-entry strong { color: #e2e8f0; }
    .log-entry span:last-child { color: #cbd5e1; }
  </style>
</head>
<body>
  <header class="command-bar">
    <div class="brand-cluster">
      <div class="brand-title">
        <span class="led-dot"></span>
        <span>Keos Room — <span class="highlight">Cyber Studio</span></span>
      </div>
      <div class="status-pills">
        <span class="pill emerald">Live Studio</span>
        <span class="pill cyan">10 Crew Members</span>
        <span id="fps-meter" class="pill">60 FPS</span>
        <span id="ws-indicator" class="pill">Connecting Stream</span>
      </div>
    </div>

    <div class="interaction-deck">
      <button id="btn-trigger-debate" class="btn-action">Debate & Drama</button>
      <button id="btn-trigger-sprint" class="btn-action">Sprint Rush</button>
      <button id="btn-trigger-coffee" class="btn-action">Coffee Break</button>
      <button id="btn-trigger-alert" class="btn-action alert">Red Alert</button>
      <button id="btn-audio" class="btn-action">Sound On</button>
    </div>
  </header>

  <main class="viewport-wrap">
    <canvas id="office-canvas"></canvas>
  </main>

  <footer class="telemetry-drawer">
    <div class="drawer-bar">
      <span>Studio Telemetry & Live Team Dialogue</span>
      <span>Vector Humanoid Engine · 60 FPS</span>
    </div>
    <div id="log-stream" class="log-stream">
      <div class="log-entry">
        <span class="log-time">Studio</span>
        <span class="log-tag">READY</span>
        <strong>Core:</strong>
        <span>Cyber Studio online. 10 humanoid specialists active at workstations.</span>
      </div>
    </div>
  </footer>

  <script type="module" src="/src/client/main.ts"></script>
</body>
</html>
